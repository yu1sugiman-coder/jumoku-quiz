<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2e7d32">
  <title>樹木医クイズ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <button class="header-btn" onclick="app.goBack()" aria-label="戻る">&#9664;</button>
    <h1>樹木医試験 予想問題クイズ</h1>
    <button class="header-btn tts-toggle" id="ttsToggle" onclick="app.toggleTTS()" aria-label="読み上げ切替">
      <svg class="tts-icon-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg class="tts-icon-off" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>
    <div class="tts-speed" id="ttsSpeed" onclick="app.cycleTTSSpeed()">1.0x</div>
  </div>

  <!-- Home -->
  <div id="home" class="screen active"></div>

  <!-- Quiz -->
  <div id="quiz" class="screen">
    <div class="quiz-header">
      <div class="quiz-progress"><div class="quiz-progress-bar" style="width:0%"></div></div>
      <span class="quiz-count">1 / 1</span>
    </div>
    <div class="quiz-body"></div>
    <div class="quiz-next-area">
      <button class="next-btn" onclick="app.next()">次の問題へ</button>
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="screen"></div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
